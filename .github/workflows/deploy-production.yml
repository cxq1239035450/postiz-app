name: Deploy production

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref_type == 'branch' && github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    concurrency:
      group: ${{ github.repository }}-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image on GitHub and deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/postiz-app' }}
          PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL || 'https://qpublush.io' }}
        run: bash deploy/automation/publish.sh
